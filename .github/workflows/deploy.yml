name: Build and deploy Berserk Web

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "engine.js"
      - "engine-worker.js"
      - "berserk engine/**"
      - "README.md"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: berserk-web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Assemble static Pages artifact
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --locked
          cargo build --manifest-path "berserk engine/Cargo.toml" --lib --no-default-features --release --target wasm32-unknown-unknown
          mkdir -p dist
          wasm-bindgen "berserk engine/target/wasm32-unknown-unknown/release/berserk.wasm" --target web --out-dir dist/engine
          cp index.html style.css app.js engine.js engine-worker.js dist/
          cp README.md dist/README.md

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
