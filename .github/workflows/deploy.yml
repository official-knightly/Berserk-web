name: Build and deploy Berserk Web

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "engine/**"
      - "README.md"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: berserk-web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website and Git LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Require and validate the actual engine binary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          wasm = Path("engine/berserk_bg.wasm")
          if not wasm.is_file():
              sys.exit("engine/berserk_bg.wasm is missing. Git LFS did not provide the engine binary.")
          size = wasm.stat().st_size
          with wasm.open("rb") as file:
              header = file.read(8)
              prefix = header + file.read(128)
          if prefix.startswith(b"version https://git-lfs.github.com/spec/v1"):
              sys.exit("Git LFS pointer text was checked out instead of the real WASM object.")
          if size < 1_000_000 or size > 100_000_000:
              sys.exit(f"Unexpected Berserk WASM size: {size} bytes.")
          if header != b"\x00asm\x01\x00\x00\x00":
              sys.exit(f"Invalid WebAssembly header: {header.hex()}")
          print(f"Validated Berserk WASM: {size} bytes; WebAssembly v1 header OK.")
          PY

      - name: Check browser engine loader syntax
        run: |
          node --check engine/engine.js
          node --check engine/engine-worker.js
          node --check engine/uci-worker.js

      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Assemble Pages artifact
        run: |
          mkdir -p dist
          cp index.html style.css README.md dist/
          cp -r engine dist/engine

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
